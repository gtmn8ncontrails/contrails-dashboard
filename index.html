<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#07071a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Contrails AI" />
  <meta name="description" content="Contrails AI GTM Intelligence Dashboard — Live pipeline insights for deepfake detection and fraud detection." />
  <title>Contrails AI — GTM Intelligence</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.svg" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">

    <!-- SPLASH SCREEN -->
    <div id="splash" class="splash">
      <div class="splash-inner">
        <div class="splash-logo-wrap">
          <svg class="splash-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="g1" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#8b5cf6"/>
                <stop offset="100%" stop-color="#3b82f6"/>
              </linearGradient>
            </defs>
            <path d="M32 4C16.536 4 4 16.536 4 32s12.536 28 28 28 28-12.536 28-28S47.464 4 32 4z" fill="url(#g1)" opacity="0.15"/>
            <path d="M8 32 Q18 18 32 22 Q46 26 56 32" stroke="url(#g1)" stroke-width="3" stroke-linecap="round" fill="none"/>
            <path d="M12 38 Q22 24 36 28 Q50 32 56 38" stroke="url(#g1)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>
            <path d="M16 44 Q26 30 40 34 Q52 38 56 44" stroke="url(#g1)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
            <circle cx="32" cy="32" r="5" fill="url(#g1)"/>
          </svg>
        </div>
        <h1 class="splash-title">Contrails AI</h1>
        <p class="splash-subtitle">GTM Intelligence</p>
        <div class="splash-loader">
          <div class="loader-bar"></div>
        </div>
      </div>
    </div>

    <!-- MAIN APP -->
    <div id="main" class="main hidden">

      <!-- HEADER -->
      <header id="app-header" class="app-header">
        <div class="header-left">
          <img src="logo.png" alt="Contrails AI" class="header-logo" style="width: 32px; height: 32px; border-radius: 8px; object-fit: contain;" />
          <div class="header-titles">
            <span class="header-brand">Contrails AI</span>
            <span id="page-title" class="header-page">Dashboard</span>
          </div>
        </div>
        <div class="header-right">
          <button id="refresh-btn" class="icon-btn" title="Refresh data" onclick="loadAllData()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"></polyline>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
          </button>
          <div id="sync-indicator" class="sync-dot idle" title="Data status"></div>
        </div>
      </header>

      <!-- PAGE CONTENT -->
      <main id="page-content" class="page-content">
        <!-- Injected by JS -->
      </main>

      <!-- BOTTOM NAV -->
      <nav id="bottom-nav" class="bottom-nav">
        <button class="nav-btn active" data-page="dashboard" onclick="navigate('dashboard')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
          </svg>
          <span>Overview</span>
        </button>
        <button class="nav-btn" data-page="signals" onclick="navigate('signals')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
          </svg>
          <span>Signals</span>
        </button>
        <button class="nav-btn" data-page="briefs" onclick="navigate('briefs')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          <span>Briefs</span>
        </button>
        <button class="nav-btn" data-page="queue" onclick="navigate('queue')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="8" y1="6" x2="21" y2="6"></line>
            <line x1="8" y1="12" x2="21" y2="12"></line>
            <line x1="8" y1="18" x2="21" y2="18"></line>
            <line x1="3" y1="6" x2="3.01" y2="6"></line>
            <line x1="3" y1="12" x2="3.01" y2="12"></line>
            <line x1="3" y1="18" x2="3.01" y2="18"></line>
          </svg>
          <span>Queue</span>
        </button>
        <button class="nav-btn" data-page="workflows" onclick="navigate('workflows')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          <span>Run</span>
        </button>
      </nav>
    </div>

    <!-- SIGNAL DETAIL MODAL -->
    <div id="modal-overlay" class="modal-overlay hidden" onclick="closeModal()">
      <div id="modal-panel" class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
          <span id="modal-badge" class="badge"></span>
          <button class="modal-close" onclick="closeModal()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div id="modal-content" class="modal-content"></div>
      </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="toast hidden"></div>

  </div>

  <script src="config.js"></script>
  <script src="mock-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
